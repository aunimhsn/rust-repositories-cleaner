[package]
name = "rust-repositories-cleaner"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A minimalist console application to protect and bulk delete your GitHub repositories."
authors = ["Aunim HASSAN"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aunimhsn/rust-repositories-cleaner"
readme = "README.md"
keywords = ["github", "repository", "cleanup", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
i18n-embed = { version = "0.16.0", features = ["fluent-system"] }
i18n-embed-fl = "0.10.1"
jiff = { version = "0.2.38", features = ["serde"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
fluent-syntax = "0.12.0"
