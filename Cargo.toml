[package]
name = "rust-repositories-cleaner"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A minimalist console application to protect and bulk delete your GitHub repositories."
authors = ["Aunim HASSAN"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aunimhsn/rust-repositories-cleaner"
readme = "README.md"
keywords = ["github", "repository", "cleanup", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
